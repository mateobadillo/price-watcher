name: price-watch

on:
  # The 30-min trigger comes from cron-job.org calling workflow_dispatch (see README). GitHub's own
  # schedule was dropped: on this repo it skipped most slots and ran the rest 4-7 h late.
  # editing the watchlist sends an update right away
  push:
    branches: [main]
    paths: ["watchlist.json", ".github/workflows/watch.yml"]
  workflow_dispatch:
    inputs:
      force:
        description: "Send now even outside 06:00–22:00"
        type: boolean
        default: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node watch.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE: ${{ inputs.force && '1' || '0' }}
