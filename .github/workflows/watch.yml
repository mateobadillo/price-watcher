name: price-watch

on:
  # every 30 min from 06:00 to 22:00 Bogotá (UTC-5, no DST) = 11:00–03:00 UTC.
  # At :07 and :37, not :00/:30: GitHub delays and can drop scheduled runs at the top of the hour
  # (the first version at :00/:30 fired zero scheduled runs in its first 1.5 h). watch.mjs also checks the hours.
  schedule:
    - cron: "7,37 11-23 * * *"
    - cron: "7,37 0-2 * * *"
    - cron: "7 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send now even outside 06:00–22:00"
        type: boolean
        default: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node watch.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE: ${{ inputs.force && '1' || '0' }}
