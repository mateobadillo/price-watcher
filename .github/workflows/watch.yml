name: price-watch

on:
  # every 30 min from 06:00 to 22:00 Bogotá (UTC-5, no DST) = 11:00–03:00 UTC.
  # GitHub may start scheduled runs a few minutes late. watch.mjs also checks the hours itself.
  schedule:
    - cron: "0,30 11-23 * * *"
    - cron: "0,30 0-2 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send now even outside 06:00–22:00"
        type: boolean
        default: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node watch.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE: ${{ inputs.force && '1' || '0' }}
